# Fixed so containers and the volume keep their names if the directory is renamed.
name: ai-unit-economics

# A minimal init as PID 1 forwards signals, so SIGTERM from `docker stop` reaches Node.
x-api-image: &api-image
  init: true
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: ai-unit-economics/api:local

# The demo uses its own database, created on first start by docker/mariadb-init, so its public
# keys never end up next to real data.
x-demo-env: &demo-env
  DB_HOST: mariadb
  DB_PORT: '3306'
  DB_USER: ${DB_USER:-aiue}
  DB_PASSWORD: ${DB_PASSWORD:-aiue}
  DB_NAME: ai_unit_economics_demo

services:
  mariadb:
    image: mariadb:11.8
    container_name: aiue-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-ai_unit_economics}
      MARIADB_USER: ${DB_USER:-aiue}
      MARIADB_PASSWORD: ${DB_PASSWORD:-aiue}
    # Local development defaults. Bound to this machine only, so they are not reachable from
    # the network; set DB_ROOT_PASSWORD and DB_PASSWORD for anything else.
    ports:
      # host port 3307 by default: 3306 is often taken by a local MySQL install
      - '127.0.0.1:${DB_PORT:-3307}:3306'
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # `docker compose --profile demo up`: the whole product with demo data.
  # The keys and password below are public on purpose and for a local demo only; every port
  # is bound to this machine. The API and dashboard images ship no default secrets.
  # ---------------------------------------------------------------------------
  migrate:
    <<: *api-image
    profiles: [demo]
    command: ['node', 'dist/cli/migrate.js']
    environment: *demo-env
    depends_on:
      mariadb:
        condition: service_healthy

  seed:
    <<: *api-image
    profiles: [demo]
    command: ['node', 'dist/cli/seed-demo.js']
    environment:
      <<: *demo-env
      AIUE_DEMO_INGESTION_KEY: aiue_live_demo_local_only
      AIUE_DEMO_READ_KEY: aiue_read_demo_local_only
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *api-image
    profiles: [demo]
    environment: *demo-env
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard:
    profiles: [demo]
    init: true
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    image: ai-unit-economics/dashboard:local
    environment:
      AIUE_API_URL: http://api:3000
      AIUE_READ_KEY: aiue_read_demo_local_only
      DASHBOARD_USER: demo
      DASHBOARD_PASSWORD: demo
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      - api
      - seed

volumes:
  mariadb-data:
